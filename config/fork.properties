# Engine settings for the patched build. Goes in <instance>/minecraft/radiance/fork.properties and is
# read once at game start. An environment variable with the same name overrides a line here.

# Render resolution per axis, relative to the DLSS mode's render size. With DLSS Quality at 1440p:
#   1.0     = 1707x960 (plain DLSS Quality)
#   0.8125  = 1387x780
#   0.78125 = 1333x750  <- cookbook default: every benchmark scene keeps 1% lows >= 147 fps on a 5090
#   0.75    = 1280x720 (same pixel count as DLSS Performance)
MCVR_RENDER_SCALE=0.78125

# Optional, measurement or experiment only:
# MCVR_SHARC_CAPACITY_LOG2=22        SHaRC radiance cache size, 2^N entries (patched default 22 = 4M)
# MCVR_DLSS_RR_PRESET=5              force a DLSS-RR preset number
# MCVR_CHUNK_BUILD_BUDGET_MS=0.3     cap on render-thread chunk batch scheduling per frame (no gain measured)
# MCVR_QUEUE_PRIORITY=high           Vulkan global queue priority (NVIDIA needs CAP_SYS_NICE for high)
